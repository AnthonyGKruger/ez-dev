<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#0a1421;font-family:Roboto,sans-serif;overflow:hidden}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(164,127,75,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(164,127,75,.07) 1px,transparent 1px);background-size:48px 48px}
  .card{position:absolute;left:36px;top:36px;right:36px;bottom:36px;border:1px solid rgba(164,127,75,.35);background:rgba(12,30,49,.85);padding:62px 62px}
  .b{position:absolute;width:22px;height:22px;border-color:#e6cb98;border-style:solid}
  .tl{top:-2px;left:-2px;border-width:2px 0 0 2px}.tr{top:-2px;right:-2px;border-width:2px 2px 0 0}
  .bl{bottom:-2px;left:-2px;border-width:0 0 2px 2px}.br{bottom:-2px;right:-2px;border-width:0 2px 2px 0}
  .mono{font-family:'JetBrains Mono',monospace}
  .logo{display:flex;align-items:center;gap:14px;color:#eef2f6;font-size:22px;font-weight:700;letter-spacing:.14em}
  .eyebrow{margin-top:70px;color:#a47f4b;font-size:20px;letter-spacing:.18em}
  h1{margin:18px 0 0;color:#f4f7fa;font-weight:900;font-size:76px;line-height:1.02;letter-spacing:-.035em}
  h1 span{color:#e6cb98}
  .foot{position:absolute;left:62px;right:62px;bottom:50px;display:flex;justify-content:space-between;font-size:20px;letter-spacing:.12em;text-transform:uppercase}
  .foot .l{color:#c3cad3}.foot .r{color:#a47f4b;text-transform:none;letter-spacing:.04em}
</style></head><body>
<div class="grid"></div>
<div class="card">
  <span class="b tl"></span><span class="b tr"></span><span class="b bl"></span><span class="b br"></span>
  <div class="logo mono"><img src="code.svg" height="30"> EZ•DEV</div>
  <div class="eyebrow mono">EZDEV SOLUTIONS · SOFTWARE STUDIO</div>
  <h1>Websites, web apps and e-commerce. <span>Done end to end.</span></h1>
  <div class="foot mono"><span class="l">SaaS · E-commerce · Client work</span><span class="r">ezdev.solutions</span></div>
</div>
</body></html>
